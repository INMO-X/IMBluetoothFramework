name: IMBluetoothFrameworkExample
options:
  bundleIdPrefix: com.inmo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  IMBluetoothFrameworkExample:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: IMBluetoothFrameworkExample
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inmo.IMBluetoothFrameworkExample
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: IMBluetoothFrameworkExample/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 需要蓝牙以连接 INMO 眼镜设备
        CODE_SIGN_STYLE: Automatic
    info:
      path: IMBluetoothFrameworkExample/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: 需要蓝牙以连接 INMO 眼镜设备
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UILaunchStoryboardName: LaunchScreen
schemes:
  IMBluetoothFrameworkExample:
    build:
      targets:
        IMBluetoothFrameworkExample: all
    run:
      config: Debug
